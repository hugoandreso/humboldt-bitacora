<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Humboldt · Bitácora de Campo</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:#f2f5ee;min-height:100vh;padding:1rem;}
.wrap{max-width:820px;margin:0 auto;}
.hdr{background:linear-gradient(135deg,#1a2a0a,#2d3a1a,#3d5a20);border-radius:16px;padding:1.3rem 1.5rem;margin-bottom:1.2rem;}
.hdr-title{font-family:'Playfair Display',serif;font-size:24px;color:#e8f0c0;font-weight:700;letter-spacing:2px;}
.hdr-sub{font-family:'Playfair Display',serif;font-style:italic;font-size:12px;color:#a8c070;margin-top:1px;}
.hdr-author{font-size:10px;color:#7a9050;letter-spacing:.8px;text-transform:uppercase;margin-top:4px;}
.hdr-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.hdr-btns{display:flex;flex-direction:column;gap:5px;align-items:flex-end;}
.btn-exp{background:rgba(255,255,255,.1);color:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:5px 11px;font-size:10px;font-family:'DM Sans',sans-serif;cursor:pointer;}
.btn-imp{background:rgba(200,168,74,.25);color:#e8d890;border:1px solid rgba(200,168,74,.4);border-radius:20px;padding:5px 11px;font-size:10px;font-family:'DM Sans',sans-serif;cursor:pointer;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:1.1rem;}
.stat{background:#fff;border-radius:10px;padding:.75rem .5rem;text-align:center;}
.stat-n{font-size:22px;font-weight:700;line-height:1;}
.stat-l{font-size:9px;text-transform:uppercase;letter-spacing:.4px;margin-top:2px;opacity:.6;}
.s0{color:#1a4a25;}.s1{color:#1a3060;}.s2{color:#6a3200;}.s3{color:#4a1a6a;}
.filters{display:flex;gap:5px;overflow-x:auto;margin-bottom:1rem;padding-bottom:2px;scrollbar-width:none;}
.filters::-webkit-scrollbar{display:none;}
.fb{font-size:11px;padding:5px 11px;border-radius:20px;border:1.5px solid #d0d8c8;background:#fff;color:#5a7a5a;white-space:nowrap;cursor:pointer;flex-shrink:0;font-family:'DM Sans',sans-serif;}
.fb.on{font-weight:600;}
.places{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-bottom:1rem;}
.pcard{background:#fff;border-radius:14px;border:2px solid #e0e8d8;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.pcard-top{padding:.9rem 1rem .7rem;cursor:pointer;}
.pcard-top:hover{background:#f8fcf8;}
.pcard-icon{font-size:28px;display:block;margin-bottom:5px;}
.pcard-name{font-family:'Playfair Display',serif;font-size:14px;font-weight:700;color:#1a2a1a;margin-bottom:1px;}
.pcard-country{font-size:10px;color:#6a8a6a;}
.pcard-type{font-size:10px;color:#8a9a8a;text-transform:uppercase;letter-spacing:.3px;}
.pcard-stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #f0f0f0;}
.ps{padding:.45rem .3rem;text-align:center;}
.ps-n{font-size:14px;font-weight:700;color:#2a4a1a;}
.ps-l{font-size:9px;color:#8a9a8a;text-transform:uppercase;}
.pcard-last{font-size:10px;color:#8a9a8a;padding:.3rem 1rem .45rem;border-top:1px solid #f8f8f8;}
.pcard-acts{padding:.35rem .8rem .5rem;border-top:1px solid #f5f5f5;display:flex;gap:5px;justify-content:flex-end;}
.btn-edit-sm{font-size:10px;padding:2px 8px;border-radius:12px;border:1px solid #b8d8b8;background:#f0f8f0;color:#2d5a3d;cursor:pointer;font-family:'DM Sans',sans-serif;}
.btn-del-sm{font-size:10px;padding:2px 8px;border-radius:12px;border:1px solid #e8b0b0;background:#fff0f0;color:#c03030;cursor:pointer;font-family:'DM Sans',sans-serif;}
.pcard-confirm{display:none;align-items:center;gap:5px;padding:6px 10px;background:#fff0f0;border-top:1px solid #f0c0c0;font-size:11px;}
.new-place{border-radius:14px;border:2px dashed #c0d8b0;background:rgba(255,255,255,.5);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:1.5rem 1rem;min-height:140px;color:#5a8a5a;font-family:'DM Sans',sans-serif;}
.new-place:hover{background:#fff;border-color:#3d5a20;}
.panel{background:#f8fcf8;border:1.5px solid #b8d8b8;border-radius:12px;padding:1.1rem;margin-bottom:1rem;display:none;}
.panel.on{display:block;}
.panel-title{font-family:'Playfair Display',serif;font-style:italic;font-size:14px;color:#1a3a1a;margin-bottom:.9rem;}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
@media(max-width:420px){.f2{grid-template-columns:1fr;}}
.flbl{font-size:10px;font-weight:600;color:#3a5a3a;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:4px;}
.fin{width:100%;border:1.5px solid #c8dcc8;border-radius:8px;padding:9px 11px;font-size:15px;font-family:'DM Sans',sans-serif;background:#fff;color:#1a2a1a;outline:none;display:block;}
.fin:focus{border-color:#3d5a20;box-shadow:0 0 0 3px rgba(61,90,32,.1);}
.pill{font-size:10px;background:#fff3cd;color:#856404;border-radius:20px;padding:1px 7px;font-weight:600;}
.ferr{display:none;font-size:11px;color:#c03030;padding:7px 10px;background:#fff0f0;border-radius:7px;border:1px solid #f0c0c0;margin-bottom:8px;}
.fbtn-row{display:grid;grid-template-columns:1fr auto;gap:8px;}
.btn-save{background:#3d5a20;color:#e8f0c0;border:none;border-radius:8px;padding:11px;font-size:13px;font-family:'DM Sans',sans-serif;font-weight:600;cursor:pointer;width:100%;}
.btn-cancel{padding:11px 13px;font-size:13px;border:1.5px solid #c8d8c8;border-radius:8px;background:#fff;color:#4a6a4a;cursor:pointer;font-family:'DM Sans',sans-serif;}
.phdr{border-radius:16px;padding:1.1rem 1.3rem;margin-bottom:1.2rem;}
.pbk{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:rgba(255,255,255,.75);background:rgba(255,255,255,.12);border:none;border-radius:20px;padding:4px 11px;cursor:pointer;font-family:'DM Sans',sans-serif;margin-bottom:8px;}
.phdr-name{font-family:'Playfair Display',serif;font-size:20px;color:#e8f0c0;font-weight:700;margin-bottom:2px;}
.phdr-meta{font-size:11px;color:rgba(255,255,255,.6);}
.btn-new-sp{background:#e8f0c0;color:#1a2a0a;border:none;border-radius:20px;padding:8px 14px;font-size:12px;font-family:'DM Sans',sans-serif;font-weight:600;cursor:pointer;}
.card{border-radius:14px;margin-bottom:9px;border:1.5px solid transparent;overflow:hidden;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.card-birds{border-color:#b8dfc5;}.card-plants{border-color:#b8d8a0;}.card-insects{border-color:#aac8f0;}.card-mammals{border-color:#f0ceaa;}.card-fungi{border-color:#e0aad0;}.card-reptiles{border-color:#a0d8dc;}.card-other{border-color:#d8d8d8;}
.ctop{padding:.85rem 1rem;cursor:pointer;user-select:none;}
.cbody{display:none;border-top:1px dashed rgba(0,0,0,.1);}
.cbody.on{display:block;}
.cen{font-family:'Playfair Display',serif;font-size:16px;font-weight:700;color:#1a2a1a;}
.ces{font-size:12px;color:#4a6a4a;margin-top:1px;}
.csci{font-size:10px;font-style:italic;color:#8aaa8a;}
.badge{font-size:9px;font-weight:600;padding:2px 8px;border-radius:20px;display:inline-flex;align-items:center;gap:2px;text-transform:uppercase;}
.b-birds{background:#2d6a3d;color:#e8faf0;}.b-plants{background:#3d6a1a;color:#e8fae0;}.b-insects{background:#1a3a8a;color:#e0eeff;}.b-mammals{background:#8a4a1a;color:#fff0e0;}.b-fungi{background:#7a1a6a;color:#fde8f8;}.b-reptiles{background:#1a6a7a;color:#e0f8fc;}.b-other{background:#5a5a5a;color:#f0f0f0;}
.mrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0 4px;}
.mp{font-size:10px;color:#6a8a6a;}
.med{font-size:10px;font-weight:500;padding:2px 8px;border-radius:20px;display:inline-flex;align-items:center;gap:2px;}
.med-p{background:#e0faf0;color:#1a6a40;}.med-d{background:#e8e0ff;color:#3a1a8a;}.med-l{background:#e8f4e8;color:#1a4a20;}
.cacts{display:flex;gap:5px;padding:.5rem 1rem;border-top:1px solid #f5f5f5;}
.tl{padding:0 1rem .9rem;}
.tl-hdr{display:flex;align-items:center;justify-content:space-between;padding:.6rem 0 .45rem;border-bottom:1px solid #eaeaea;margin-bottom:.65rem;}
.tl-ttl{font-size:10px;font-weight:600;color:#5a7a5a;text-transform:uppercase;letter-spacing:.5px;}
.btn-new-entry{font-size:11px;font-weight:600;font-family:'DM Sans',sans-serif;padding:5px 11px;border-radius:20px;border:1.5px solid #3d5a20;background:#f0f8e8;color:#2d3a1a;cursor:pointer;}
.entry{display:flex;gap:9px;margin-bottom:11px;position:relative;}
.entry:not(:last-child)::before{content:'';position:absolute;left:14px;top:30px;bottom:-4px;width:2px;background:#e0e8d8;}
.edot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;border:2px solid #e0e8d8;background:#f8fcf8;z-index:1;}
.edot.first{background:#e8f5e0;border-color:#b8d8b8;}
.econtent{flex:1;min-width:0;}
.edate{font-size:10px;font-weight:600;color:#5a8a6a;margin-bottom:2px;}
.enote{font-size:12px;color:#2a3a2a;line-height:1.55;font-style:italic;margin-bottom:5px;}
.enote::before{content:'"';}.enote::after{content:'"';}
.eacts{display:flex;gap:5px;margin-bottom:4px;}
.eviewer{border-radius:8px;overflow:hidden;background:#111;margin-bottom:5px;}
.eviewer img{width:100%;max-height:200px;object-fit:contain;display:block;}
.evbar{display:flex;align-items:center;justify-content:space-between;padding:5px 8px;background:#1e1e1e;gap:4px;}
.evnav{background:none;border:none;color:#bbb;cursor:pointer;font-size:11px;font-family:'DM Sans',sans-serif;padding:3px 6px;border-radius:5px;}
.evnav:disabled{opacity:.3;cursor:default;}
.evdel{font-size:10px;font-family:'DM Sans',sans-serif;padding:3px 8px;border-radius:5px;border:1px solid #7a3030;background:#3a1010;color:#ff9090;cursor:pointer;}
.evconfirm{display:none;align-items:center;gap:5px;padding:5px 8px;background:#2a1010;border-top:1px solid #5a2020;}
.ethumbs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px;}
.ethumb{width:54px;height:54px;border-radius:7px;overflow:hidden;cursor:pointer;border:2px solid transparent;flex-shrink:0;}
.ethumb:hover{border-color:#5a9a6a;}.ethumb.on{border-color:#2d5a3d;}
.ethumb img{width:100%;height:100%;object-fit:cover;display:block;}
.add-ephoto{width:54px;height:54px;border:2px dashed #a8c8a8;background:#f4faf4;flex-shrink:0;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;}
.add-ephoto:hover{background:#e8f5e8;}
.no-photo-lbl{border:1.5px dashed #b8d8b8;border-radius:8px;padding:.5rem;text-align:center;background:#f8fcf8;font-size:10px;color:#7aaa7a;cursor:pointer;display:block;}
.no-photo-lbl:hover{background:#eef8ee;}
.confirm-row{display:none;align-items:center;gap:5px;padding:5px 8px;background:#fff0f0;border-radius:7px;border:1px solid #f0c0c0;margin-top:3px;font-size:10px;}
.btn-yes{padding:3px 10px;border-radius:5px;border:none;background:#c03030;color:#fff;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;}
.btn-no{padding:3px 8px;border-radius:5px;border:1px solid #ddd;background:#fff;color:#666;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:11px;}
.divider{display:flex;align-items:center;gap:8px;margin-bottom:.9rem;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#d0e0c0;}
.divider span{font-size:10px;color:#8aaa8a;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;}
.empty{text-align:center;padding:3rem 0;color:#8aaa8a;background:#fff;border-radius:14px;border:1.5px dashed #c8d8b8;}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(8px);background:#2d3a1a;color:#c8e890;font-size:13px;font-family:'DM Sans',sans-serif;padding:10px 20px;border-radius:20px;opacity:0;transition:all .3s;pointer-events:none;z-index:9999;white-space:nowrap;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
input[type=file].hf{display:none;}
</style>

<body>
<div class="wrap">
  <input type="file" id="import-input" class="hf" accept=".json" onchange="importData(event)">
  <div id="app"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const COUNTRIES=[{code:'ar',name:'Argentina',f:'🇦🇷'},{code:'bo',name:'Bolivia',f:'🇧🇴'},{code:'br',name:'Brasil',f:'🇧🇷'},{code:'ca',name:'Canadá',f:'🇨🇦'},{code:'cl',name:'Chile',f:'🇨🇱'},{code:'co',name:'Colombia',f:'🇨🇴'},{code:'cr',name:'Costa Rica',f:'🇨🇷'},{code:'ec',name:'Ecuador',f:'🇪🇨'},{code:'es',name:'España',f:'🇪🇸'},{code:'mx',name:'México',f:'🇲🇽'},{code:'pe',name:'Perú',f:'🇵🇪'},{code:'uy',name:'Uruguay',f:'🇺🇾'},{code:'us',name:'Estados Unidos',f:'🇺🇸'},{code:'ve',name:'Venezuela',f:'🇻🇪'},{code:'de',name:'Alemania',f:'🇩🇪'},{code:'fr',name:'Francia',f:'🇫🇷'},{code:'gb',name:'Reino Unido',f:'🇬🇧'},{code:'au',name:'Australia',f:'🇦🇺'},{code:'nz',name:'Nueva Zelanda',f:'🇳🇿'},{code:'other',name:'Otro país',f:'🌍'}];
const PTYPES=[{id:'urban',l:'Parque urbano',e:'🏙'},{id:'forest',l:'Bosque / Monte',e:'🌲'},{id:'coast',l:'Costa / Mar',e:'🌊'},{id:'wetland',l:'Humedal / Río',e:'🌿'},{id:'mountain',l:'Montaña',e:'🏔'},{id:'rural',l:'Campo / Rural',e:'🌾'},{id:'other',l:'Otro lugar',e:'📍'}];
const PCOLORS=['#3d5a20','#1a5a80','#804a1a','#5a1a80','#1a4a6a','#2d6a3d','#6a3a1a'];
const CATS=[{id:'all',es:'Todas',en:'All',e:'🔲'},{id:'birds',es:'Aves',en:'Birds',e:'🪶'},{id:'plants',es:'Plantas',en:'Plants',e:'🌿'},{id:'insects',es:'Insectos',en:'Insects',e:'🦋'},{id:'mammals',es:'Mamíferos',en:'Mammals',e:'🐾'},{id:'fungi',es:'Hongos',en:'Fungi',e:'🍄'},{id:'reptiles',es:'Reptiles',en:'Reptiles',e:'🦎'},{id:'other',es:'Otros',en:'Other',e:'•'}];
const FC={all:'#3d5a20',birds:'#1a5a30',plants:'#2a5a10',insects:'#1a2a7a',mammals:'#7a3a10',fungi:'#6a1a6a',reptiles:'#105a6a',other:'#4a4a4a'};
const WX=[{v:'sunny',l:'Soleado',e:'☀️'},{v:'cloudy',l:'Nublado',e:'☁️'},{v:'overcast',l:'Cubierto',e:'🌥️'},{v:'rainy',l:'Lluvia',e:'🌧️'},{v:'windy',l:'Viento',e:'💨'},{v:'foggy',l:'Niebla',e:'🌫️'}];
const EICO={birds:'🪶',plants:'🌱',insects:'🦋',mammals:'🐾',fungi:'🍄',reptiles:'🦎',other:'📝'};
const SK='humboldt';
let places=[],obs=[],npid=1,noid=1,nlid=1,pid=null,filt='all',open=new Set(),efOpen=new Set(),PC={},AT={},PD={};

let _t=null;
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('on');clearTimeout(_t);_t=setTimeout(()=>e.classList.remove('on'),2500);}
function save(){try{localStorage.setItem(SK,JSON.stringify({places,obs,npid,noid,nlid}));}catch(e){}}
function load(){try{const r=localStorage.getItem(SK);if(r){const d=JSON.parse(r);places=d.places||[];obs=d.obs||[];npid=d.npid||1;noid=d.noid||1;nlid=d.nlid||1;return true;}}catch(e){}return false;}
function pk(a,b){return a+'-'+b;}
function savePh(oi,li,arr){PC[pk(oi,li)]=[...arr];try{arr.length?localStorage.setItem('hb-ph-'+pk(oi,li),JSON.stringify(arr)):localStorage.removeItem('hb-ph-'+pk(oi,li));}catch(e){}}
function getPh(oi,li){const k=pk(oi,li);if(PC[k])return PC[k];try{const r=localStorage.getItem('hb-ph-'+k);PC[k]=r?JSON.parse(r):[];}catch(e){PC[k]=[];}return PC[k];}
function exportData(){const b=new Blob([JSON.stringify({places,obs,npid,noid,nlid},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='humboldt_'+new Date().toISOString().split('T')[0]+'.json';a.click();toast('✓ Backup exportado');}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);places=d.places||[];obs=d.obs||[];npid=d.npid||1;noid=d.noid||1;nlid=d.nlid||1;save();PC={};renderHome();toast('✓ Datos restaurados: '+places.length+' lugar(es)');}catch(err){toast('⚠ Archivo no válido');}};r.readAsText(f);e.target.value='';}
function resize(file){return new Promise(res=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let w=img.width,h=img.height;if(w>900){h=Math.round(h*900/w);w=900;}if(h>700){w=Math.round(w*700/h);h=700;}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.78));};img.src=url;});}
function pt(id){return PTYPES.find(t=>t.id===id)||PTYPES[PTYPES.length-1];}
function ct(id){return COUNTRIES.find(c=>c.code===id)||COUNTRIES[COUNTRIES.length-1];}
function co(id){return CATS.find(c=>c.id===id)||CATS[CATS.length-1];}
function wx(v){return WX.find(w=>w.v===v)||WX[0];}
function fd(d){if(!d)return'';const[y,m,dy]=d.split('-');return dy+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]+' '+y;}
function td(){return new Date().toISOString().split('T')[0];}
function pobs(id){return obs.filter(o=>o.pid===id);}
function pst(id){const po=pobs(id);const tl=po.reduce((a,o)=>a+o.logs.length,0);const tp=po.reduce((a,o)=>a+o.logs.reduce((b,l)=>b+getPh(o.id,l.id).length,0),0);const ds=po.flatMap(o=>o.logs.map(l=>l.date)).sort();return{sp:po.length,en:tl,ph:tp,last:ds[ds.length-1]};}
function cOpts(s=''){return CATS.filter(c=>c.id!=='all').map(c=>`<option value="${c.id}"${c.id===s?' selected':''}>${c.e} ${c.es}/${c.en}</option>`).join('');}
function wxOpts(s=''){return WX.map(w=>`<option value="${w.v}"${w.v===s?' selected':''}>${w.e} ${w.l}</option>`).join('');}
function ctOpts(s='cl'){return COUNTRIES.map(c=>`<option value="${c.code}"${c.code===s?' selected':''}>${c.f} ${c.name}</option>`).join('');}
function ptOpts(s='urban'){return PTYPES.map(t=>`<option value="${t.id}"${t.id===s?' selected':''}>${t.e} ${t.l}</option>`).join('');}
function pcOpts(s=''){return PCOLORS.map((c,i)=>`<option value="${c}"${c===s?' selected':''}>${['Verde bosque','Azul lago','Naranja','Violeta','Azul costa','Verde claro','Marrón'][i]}</option>`).join('');}

function renderHome(){
  pid=null;filt='all';open=new Set();efOpen=new Set();
  obs.forEach(o=>o.logs.forEach(l=>getPh(o.id,l.id)));
  document.getElementById('app').innerHTML=`

  const o=obs.find(x=>x.id===oi);if(!o)return;const l=o.logs.find(x=>x.id===li);if(!l)return;
  const n=document.getElementById('ee-note-'+oi+'-'+li);if(n&&n.value.trim())l.note=n.value.trim();
  l.date=document.getElementById('ee-date-'+oi+'-'+li)?.value||l.date;l.weather=document.getElementById('ee-wx-'+oi+'-'+li)?.value||l.weather;l.hasDrawing=document.getElementById('ee-draw-'+oi+'-'+li)?.checked||false;
  save();closeEntryEdit(oi,li);renderObs();toast('✓ Entrada actualizada');
}
function renderEPh(oi,li){
  const k=pk(oi,li),p=getPh(oi,li),el=document.getElementById('eph-'+k);if(!el)return;
  if(p.length===0){el.innerHTML=`<input type="file" id="efi-${k}" class="hf" accept="image/*" multiple onchange="addPh(event,${oi},${li})"><label for="efi-${k}" class="no-photo-lbl">📷 Adjuntar foto</label>`;return;}
  const idx=Math.min(AT[k]??0,p.length-1);AT[k]=idx;
  el.innerHTML=`<div class="eviewer"><img src="${p[idx]}" alt="Foto ${idx+1}"><div class="evbar"><button class="evnav" onclick="navPh(${oi},${li},-1)" ${idx===0?'disabled':''}>◀</button><span style="font-size:10px;color:#888;">${idx+1}/${p.length}</span><button class="evdel" onclick="askPhDel(${oi},${li},${idx})">🗑 Eliminar</button><button class="evnav" onclick="navPh(${oi},${li},1)" ${idx===p.length-1?'disabled':''}>▶</button></div><div class="evconfirm" id="phc-${k}"><span style="font-size:10px;color:#cc8888;flex:1;">¿Eliminar esta foto?</span><button class="btn-yes" onclick="delPh(${oi},${li})">Sí</button><button class="btn-no" onclick="cancelPhDel(${oi},${li})">No</button></div></div>
  <div class="ethumbs">${p.map((img,i)=>`<div class="ethumb${i===idx?' on':''}" onclick="setAT(${oi},${li},${i})"><img src="${img}"></div>`).join('')}<input type="file" id="efa-${k}" class="hf" accept="image/*" multiple onchange="addPh(event,${oi},${li})"><label for="efa-${k}" class="add-ephoto" title="Añadir"><span style="font-size:14px;">➕</span><span style="font-size:9px;color:#7aaa7a;">Añadir</span></label></div>`;
}
function navPh(oi,li,d){const k=pk(oi,li),p=getPh(oi,li),c=AT[k]??0;AT[k]=Math.max(0,Math.min(p.length-1,c+d));renderEPh(oi,li);}
function setAT(oi,li,i){AT[pk(oi,li)]=i;renderEPh(oi,li);}
function askPhDel(oi,li,i){PD[pk(oi,li)]=i;const el=document.getElementById('phc-'+pk(oi,li));if(el)el.style.display='flex';}
function cancelPhDel(oi,li){delete PD[pk(oi,li)];const el=document.getElementById('phc-'+pk(oi,li));if(el)el.style.display='none';}
function delPh(oi,li){const k=pk(oi,li),i=PD[k];if(i===undefined)return;const p=getPh(oi,li);p.splice(i,1);savePh(oi,li,p);AT[k]=Math.max(0,(AT[k]??0)-1);delete PD[k];renderEPh(oi,li);toast('Foto eliminada');}
async function addPh(e,oi,li){const files=Array.from(e.target.files);if(!files.length)return;const k=pk(oi,li),el=document.getElementById('eph-'+k);if(el)el.innerHTML=`<p style="font-size:11px;color:#5a8a6a;padding:8px;">⏳ Procesando...</p>`;const ex=getPh(oi,li);const ni=await Promise.all(files.map(f=>resize(f)));const all=[...ex,...ni];savePh(oi,li,all);AT[k]=all.length-1;save();toast(`${ni.length} foto${ni.length>1?'s':''} guardada${ni.length>1?'s':''} ✓`);renderEPh(oi,li);}

function renderObs(){
  const po=pobs(pid),list=filt==='all'?po:po.filter(o=>o.cat===filt);
  const sorted=[...list].sort((a,b)=>{const la=a.logs[a.logs.length-1]?.date||'';const lb=b.logs[b.logs.length-1]?.date||'';return lb.localeCompare(la);});
  document.getElementById('emp').style.display=sorted.length===0?'block':'none';
  const el=document.getElementById('ol');if(!el)return;
  el.innerHTML=sorted.map(o=>{
    const c=co(o.cat),isOpen=open.has(o.id),tp=o.logs.reduce((a,l)=>a+getPh(o.id,l.id).length,0),last=o.logs[o.logs.length-1];
    const logs=[...o.logs].sort((a,b)=>a.date.localeCompare(b.date));
    const ico=EICO[o.cat]||'📝';
    const entries=isOpen?logs.map((l,i)=>{const k=pk(o.id,l.id),w=wx(l.weather);return`<div class="entry"><div class="edot${i===0?' first':''}">${i===0?ico:'📝'}</div><div class="econtent"><div class="edate">📅 ${fd(l.date)} ${w.e} ${w.l}${l.hasDrawing?' ✏️':''}</div><div class="enote">${l.note}</div><div id="eph-${k}"></div><div id="ee-${k}"></div><div class="eacts"><button class="btn-edit-sm" onclick="openEntryEdit(${o.id},${l.id})">✏️ Editar</button><button class="btn-del-sm" onclick="askDE(${o.id},${l.id})">🗑 Eliminar</button></div><div class="confirm-row" id="dec-${k}"><span style="color:#c03030;flex:1;">¿Eliminar entrada?</span><button class="btn-yes" onclick="delEntry(${o.id},${l.id})">Sí</button><button class="btn-no" onclick="cancelDE(${o.id},${l.id})">No</button></div></div></div>`;}).join(''):'';
    return`<div class="card card-${o.cat}">
      <div class="ctop" onclick="toggleObs(${o.id})">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;"><div style="flex:1;min-width:0;"><div class="cen">${c.e} ${o.nameEn}</div><div class="ces">${o.nameEs}${o.sciName?`<span class="csci"> · ${o.sciName}</span>`:''}</div></div><span style="font-size:14px;color:#8aaa8a;">${isOpen?'▲':'▼'}</span></div>
        <div class="mrow"><span class="badge b-${o.cat}">${c.e} ${c.en}</span>${o.location?`<span class="mp">📍 ${o.location}</span>`:''}<span class="mp" style="margin-left:auto;">📅 ${fd(o.logs[0]?.date||'')}</span></div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:3px;align-items:center;"><span class="med med-l">📖 ${o.logs.length}</span>${tp>0?`<span class="med med-p">📷 ${tp}</span>`:''}${o.hasDrawing?`<span class="med med-d">✏️</span>`:''}${last?`<span class="mp" style="margin-left:auto;font-style:italic;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${last.note.substring(0,40)}${last.note.length>40?'…':''}</span>`:''}</div>
      </div>
      ${isOpen?`<div class="cbody on"><div class="tl"><div class="tl-hdr"><span class="tl-ttl">📖 Seguimiento (${o.logs.length})</span><button class="btn-new-entry" id="efbtn-${o.id}" onclick="toggleEF(${o.id})">＋ Nueva entrada</button></div><div id="ef-${o.id}"></div>${entries}</div><div class="cacts"><button class="btn-edit-sm" onclick="openObsEdit(${o.id})">✏️ Editar especie</button><button class="btn-del-sm" onclick="askDO(${o.id})">🗑 Eliminar especie</button></div><div class="panel" id="oe-${o.id}" style="margin:.5rem 1rem .8rem;border-radius:10px;"></div><div class="confirm-row" id="doc-${o.id}" style="margin:.5rem 1rem .8rem;"><span style="color:#c03030;flex:1;">¿Eliminar especie y sus entradas?</span><button class="btn-yes" onclick="delObs(${o.id})">Sí</button><button class="btn-no" onclick="cancelDO(${o.id})">No</button></div></div>`:''}
    </div>`;
  }).join('');
  sorted.forEach(o=>{if(!open.has(o.id))return;o.logs.forEach(l=>renderEPh(o.id,l.id));if(efOpen.has(o.id)){const el=document.getElementById('ef-'+o.id);if(el)el.innerHTML=efHTML(o.id);}});
}
function toggleObs(id){if(open.has(id))open.delete(id);else open.add(id);renderObs();}
function askDO(id){const el=document.getElementById('doc-'+id);if(el)el.style.display='flex';}
function cancelDO(id){const el=document.getElementById('doc-'+id);if(el)el.style.display='none';}
function delObs(id){const o=obs.find(x=>x.id===id);if(o)o.logs.forEach(l=>{localStorage.removeItem('hb-ph-'+pk(id,l.id));delete PC[pk(id,l.id)];});obs=obs.filter(o=>o.id!==id);open.delete(id);efOpen.delete(id);save();renderObs();toast('Especie eliminada');}
function askDE(oi,li){const el=document.getElementById('dec-'+pk(oi,li));if(el)el.style.display='flex';}
function cancelDE(oi,li){const el=document.getElementById('dec-'+pk(oi,li));if(el)el.style.display='none';}
function delEntry(oi,li){localStorage.removeItem('hb-ph-'+pk(oi,li));delete PC[pk(oi,li)];const o=obs.find(x=>x.id===oi);if(!o)return;o.logs=o.logs.filter(l=>l.id!==li);save();renderObs();toast('Entrada eliminada');}

load();
obs.forEach(o=>o.logs.forEach(l=>getPh(o.id,l.id)));
renderHome();
</script>
</body>
</html>
